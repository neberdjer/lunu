[workspace]
resolver = "2"
members = [
    "crates/lunu",
    "crates/lunu-core",
    "crates/lunu-i18n",
    "crates/lunu-config",
    "crates/lunu-db",
    "crates/lunu-api",
    "crates/lunu-web",
    "crates/lunu-integrations",
    "crates/lunu-jobs",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
authors = ["Lunu contributors"]
repository = "https://heliopolis.live/atums/lunu"

[workspace.dependencies]
lunu-core = { path = "crates/lunu-core", version = "0.1" }
lunu-i18n = { path = "crates/lunu-i18n", version = "0.1" }
lunu-config = { path = "crates/lunu-config", version = "0.1" }
lunu-db = { path = "crates/lunu-db", version = "0.1" }
lunu-api = { path = "crates/lunu-api", version = "0.1" }
lunu-integrations = { path = "crates/lunu-integrations", version = "0.1" }
lunu-jobs = { path = "crates/lunu-jobs", version = "0.1" }

actix-web = "4"
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-actix-web = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "any",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
askama = "0.13"
